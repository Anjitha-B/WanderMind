version: 2

# Weekly. Minor and patch updates are grouped into one PR per entry;
# major updates are left ungrouped, so each arrives as its own PR.
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # React and its types move together at every level, majors included.
      # Listed first: Dependabot puts each dependency in the first group it matches.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
        update-types: [major, minor, patch]
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
