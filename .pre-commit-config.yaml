# Install once per clone:  cd backend && uv run pre-commit install
# Run on everything:       cd backend && uv run pre-commit run --all-files
# ruff reads backend/pyproject.toml; e2e/ruff.toml extends it.
# The local hooks need `npm install` in frontend/ and `uv sync` in backend/.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        files: ^(backend|e2e)/.*\.py$
      - id: ruff-format
        files: ^(backend|e2e)/.*\.py$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        language: system
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown --ignore-path frontend/.prettierignore
        files: ^frontend/

      - id: api-types
        name: frontend API types match the backend
        language: system
        entry: npm --prefix frontend run --silent check:api
        files: ^(backend/app/|backend/scripts/export_openapi\.py|frontend/types/api\.ts)
        pass_filenames: false
